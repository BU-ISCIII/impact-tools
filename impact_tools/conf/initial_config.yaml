# Example user configuration for impact-tools.
#
# Copy this file, adapt the required values and install it with:
#
#   impact-tools add-extra-config --config-file /path/to/impact-config.yaml
#
# The resulting configuration is stored in:
#   ~/.impact_tools/extra_config.json
#
# Explicit command-line arguments always override these values.

logs:
  # Base directory used for modules without an explicit path below.
  # Their logs are stored under <default_outpath>/<module>/.
  # Set to null to disable command-level logs unless a module path is defined.
  default_outpath: /impact_data/logs/impact-tools

  # Optional destination override for each command.
  # Remove entries that should use default_outpath instead.
  modules_outpath:
    ega_encrypt: /impact_data/logs/impact-tools/ega/encrypt
    ega_upload_inbox: /impact_data/logs/impact-tools/ega/upload-inbox
    ega_encrypt_slurm: /impact_data/logs/impact-tools/ega/encrypt-slurm
    ega_encrypt_upload: /impact_data/logs/impact-tools/ega/encrypt-upload
    beacon_liftover: /impact_data/logs/impact-tools/beacon/liftover
    beacon_pgx: /impact_data/logs/impact-tools/beacon/pgx
    beacon_ingest_dataset: /impact_data/logs/impact-tools/beacon/ingest-dataset
    beacon_ingest_variants: /impact_data/logs/impact-tools/beacon/ingest-variants

ega:
  # Shared SQLite registry for successful encryption and Inbox upload events.
  # Content hashes make tracking independent from batch folder organization.
  # Keep this file on persistent storage with reliable POSIX file locking.
  # Set to null to disable by default.
  registry_file: ~/.impact_tools/ega_registry.sqlite3

  execution:
    # Label stored in every metrics manifest to identify the execution site.
    # Recommended values: local, ws or hpc.
    profile: local

  workflow:
    # Combined reports generated by `ega encrypt-upload`.
    # When null, workflow_reports is created under the encrypted output.
    output_dir: null

  encryption:
    # Base directory containing the raw files or sample directories to encrypt.
    # It can still be overridden with --input-dir.
    input_dir: /impact_data/raw_data/lega

    # Destination for encrypted files, metrics, manifests and plots.
    # When null, the command creates encrypted_c4gh under input_dir.
    output_dir: /impact_data/raw_data/lega/encrypted_c4gh

    # LocalEGA Crypt4GH public key used to encrypt files.
    # Store only the key path here, never private key contents.
    recipient_pubkey: /secure/localega/service.key.pub

    # Optional path to the crypt4gh executable.
    # Leave null to use the first crypt4gh available in PATH.
    crypt4gh_bin: null

  inbox:
    # Directory containing the encrypted .c4gh files to upload.
    input_dir: /impact_data/raw_data/lega/encrypted_c4gh

    # Directory for upload logs, metrics and manifests.
    # When null, inbox_upload_reports is created under input_dir.
    output_dir: null

    # Hostname or IP address of the LocalEGA Inbox SFTP service.
    host: dcontainers00

    # External SFTP port exposed by the Inbox container.
    port: 2222

    # Federated EGA username used for Inbox authentication.
    username: user@example.org

    # Destination directory inside the SFTP Inbox.
    remote_dir: /

    # flat uploads only file names; relative preserves sample subdirectories.
    remote_layout: flat

    # Optional SSH private key used for SFTP authentication.
    # Store only its path and protect the key with filesystem permissions.
    identity_file: ~/.ssh/localega_inbox

    # Unknown host-key handling:
    #   auto-add: accept and remember a previously unknown host key.
    #   reject: refuse connections to unknown hosts.
    host_key_policy: auto-add

    # Maximum number of seconds allowed to establish the SFTP connection.
    connect_timeout: 30

  slurm_encryption:
    # Optional SLURM-specific input directory. When null, encryption.input_dir
    # is used.
    input_dir: null

    # Optional SLURM-specific encrypted output directory. When null,
    # encryption.output_dir is used.
    output_dir: null

    # Optional SLURM-specific Crypt4GH public key. When null,
    # encryption.recipient_pubkey is used.
    recipient_pubkey: null

    # Optional SLURM-specific crypt4gh executable. When null,
    # encryption.crypt4gh_bin or PATH is used.
    crypt4gh_bin: null

    # Glob used to discover raw files recursively.
    pattern: "*.fastq.gz"

    # How array tasks are generated:
    #   sample: group files by their sample directory.
    #   file: create tasks from individual files.
    task_layout: sample

    # Number of samples or files processed by each array task.
    items_per_task: 1

    # Name shown for the job in the SLURM queue.
    job_name: localega_encrypt

    # HPC partition and optional accounting project.
    partition: middle_idx
    account: null

    # Working directory used by the SLURM job. Leave null to omit --chdir.
    chdir: null

    # CPU and memory resources requested for each array task.
    ntasks: 1
    cpus_per_task: 2
    mem: 8G

    # Maximum runtime for each task, in SLURM HH:MM:SS format.
    time_limit: "24:00:00"

    # Shell commands executed before impact-tools in every task.
    # For example, module loading or environment activation commands.
    setup_commands: []

    # Skip SHA256 calculation when true. This is faster but less auditable.
    no_checksums: false

    # Generate encryption plots inside every SLURM task.
    generate_plots: false

    # Replace existing encrypted outputs when true.
    force: false

    # Stop processing the current task after its first failed file.
    fail_fast: true

beacon:
  execution:
    # Execution environment label used by Beacon liftover and Beacon ingest.
    # Current accepted CLI values are: local, ws, hpc.
    # This is metadata for metrics/manifests; it does not change the backend.
    profile: local

  mongo:
    # Direct MongoDB connection used by Beacon dataset and variant ingestion.
    host: null # hostname or IP address of the MongoDB server
    port: 8085
    user: root

    # Keep null in the template. Prefer IMPACT_TOOLS_BEACON_MONGO_PASSWORD
    # or a private local extra config for the real password.
    password: null

    auth_source: admin
    database: beacon
    direct: true

    # TLS options for MongoDB. Leave tls=false for the current ISCIII-CIBER setup.
    tls: false
    tls_ca: /etc/mongo/certs/ca.crt
    tls_cert: /etc/mongo/certs/server.pem
    tls_allow_invalid: false

    server_timeout_ms: 10000
    connect_timeout_ms: 10000
    socket_timeout_ms: 30000

  api:
    # Beacon API base URL used for post-ingest validation.
    # Keep it without /api because the API client appends the API path.
    base_url: http://beaconaf-isciiiciber.isciiides.es:8443
    timeout_seconds: 30
    verify_tls: false

  pgx:
    # Execution backend for `impact-tools beacon pgx`.
    # Accepted values: local, hpc.
    # local uses Docker; hpc generates an sbatch/Singularity launcher.
    executor: local

    # Root output directory. When null, PGx uses the current directory.
    output_dir: null

    # Required unless passed with --ref-fasta.
    ref_fasta: null

    # Required unless passed with --pgx-image.
    # Use a Docker image name for executor=local or a .sif path for executor=hpc.
    pgx_image: null

    # Optional GLnexus image. When null, the PGx code uses its built-in default.
    glnexus_image: null

    # GLnexus preset. "gatk" is the default used for DRAGEN gVCFs.
    glnexus_config: gatk

    # Number of Snakemake jobs used inside the generated PGx launcher.
    snakemake_jobs: 8

    # Optional PyPGx Snakefile path. Leave null unless the offline PyPGx resources
    # are configured and --pypgx is used.
    pypgx_snakefile: null

    slurm:
      # Used only when executor=hpc.
      time_limit: "24:00:00"
      memory: 32G
      cpus: 8
      job_name: null
      extra_args: []