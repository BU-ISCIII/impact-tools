[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "impact-tools"
version = "0.1.0"
description = "Utilities for Go-IMPaCT Beacon and EGA workflows"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "paramiko>=3.4",
    "PyYAML>=6.0",
    "rich>=13.0",
    "beacon2-ri-tools-v2 @ git+https://github.com/BU-ISCIII/beacon2-ri-tools-v2@main",
]

[project.optional-dependencies]
plots = [
    "matplotlib>=3.7",
]

[project.scripts]
impact-tools = "impact_tools.__main__:main"

[tool.setuptools.packages.find]
exclude = ["docs"]

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
"impact_tools.beacon.resources" = ["Snakefile"]
impact_tools = ["conf/*.json", "conf/*.yaml"]
